<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBiz Manager Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --glass: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app-shell {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* HEADER */
        header {
            padding: 25px 20px;
            text-align: center;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* NAVIGATION */
        nav {
            display: flex;
            padding: 10px 20px;
            gap: 10px;
        }

        .nav-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: #e2e8f0;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #64748b;
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        /* CONTENT AREA */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: none;
        }

        .content::-webkit-scrollbar { display: none; }

        .section {
            display: none;
            animation: slideUp 0.5s ease;
        }

        .section.active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARDS & INPUTS */
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .balance-card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            text-align: center;
        }

        .balance-card h2 { font-size: 2rem; margin: 10px 0; }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-primary { background: var(--primary); }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }

        .btn-main:active { transform: scale(0.97); }

        /* LISTS */
        .list-item {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.4s ease;
            border-left: 5px solid var(--primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; scale: 0.9; }
            to { opacity: 1; scale: 1; }
        }

        .delete-btn {
            color: var(--danger);
            cursor: pointer;
            padding: 5px;
        }

        .finance-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <header>
            <h1><i class="fas fa-rocket"></i> MyBiz Manager</h1>
        </header>

        <nav>
            <button class="nav-btn active" onclick="tab('stock', this)">
                <i class="fas fa-boxes-stacked"></i> Stock
            </button>
            <button class="nav-btn" onclick="tab('finance', this)">
                <i class="fas fa-wallet"></i> Finance
            </button>
        </nav>

        <div class="content">
            <div id="stock" class="section active">
                <div class="card">
                    <input type="text" id="itemName" placeholder="Anaran'ny entana...">
                    <input type="number" id="itemQty" placeholder="Isany (Qty)...">
                    <button class="btn-main btn-primary" onclick="addStock()">
                        <i class="fas fa-plus"></i> Ampiana amin'ny Stock
                    </button>
                </div>
                <div id="stockList"></div>
            </div>

            <div id="finance" class="section">
                <div class="card balance-card">
                    <p>Totaly Vola Am-pitoerana</p>
                    <h2 id="balance">0 Ar</h2>
                </div>
                <div class="card">
                    <input type="number" id="amount" placeholder="Sandam-bola (Ar)...">
                    <div class="finance-row">
                        <button class="btn-main btn-success" onclick="updateFinance('in')">
                            <i class="fas fa-arrow-down"></i> Miditra
                        </button>
                        <button class="btn-main btn-danger" onclick="updateFinance('out')">
                            <i class="fas fa-arrow-up"></i> Mivoaka
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DATA STORAGE
        let stocks = JSON.parse(localStorage.getItem('myBiz_stocks')) || [];
        let balance = JSON.parse(localStorage.getItem('myBiz_balance')) || 0;

        // INITIALIZE
        window.onload = () => {
            renderStock();
            renderFinance();
        };

        // NAVIGATION LOGIC
        function tab(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        // STOCK LOGIC
        function addStock() {
            const name = document.getElementById('itemName').value;
            const qty = document.getElementById('itemQty').value;

            if(!name || !qty) return alert("Fenoy tsara ny banga!");

            stocks.push({ id: Date.now(), name, qty });
            saveData();
            renderStock();
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '';
        }

        function deleteStock(id) {
            stocks = stocks.filter(s => s.id !== id);
            saveData();
            renderStock();
        }

        function renderStock() {
            const list = document.getElementById('stockList');
            list.innerHTML = stocks.map(s => `
                <div class="list-item">
                    <div>
                        <strong>${s.name}</strong><br>
                        <small style="color:#64748b">Isany: ${s.qty}</small>
                    </div>
                    <i class="fas fa-trash delete-btn" onclick="deleteStock(${s.id})"></i>
                </div>
            `).join('');
        }

        // FINANCE LOGIC
        function updateFinance(type) {
            const val = parseFloat(document.getElementById('amount').value);
            if(isNaN(val)) return alert("Ampidiro ny vola!");

            if(type === 'in') balance += val;
            else balance -= val;

            saveData();
            renderFinance();
            document.getElementById('amount').value = '';
        }

        function renderFinance() {
            const el = document.getElementById('balance');
            el.innerText = balance.toLocaleString() + " Ar";
            el.style.color = balance >= 0 ? "#22c55e" : "#ef4444";
        }

        // PERSISTENCE
        function saveData() {
            localStorage.setItem('myBiz_stocks', JSON.stringify(stocks));
            localStorage.setItem('myBiz_balance', JSON.stringify(balance));
        }
    </script>
</body>
</html>
