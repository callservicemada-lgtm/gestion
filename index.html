<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GestionKo ULTIMATE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --accent: #fbbf24;
            --success: #10b981;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            color: #1e293b;
        }

        /* Ny ao ambadika (Main Content) rehefa mipoitra ny Modal */
        #main-wrapper.is-blurred {
            filter: blur(10px);
            transform: scale(0.95);
            transition: 0.4s ease;
        }

        /* Header Gradient */
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 40px 25px 80px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
        }

        .balance-amount { font-size: 45px; font-weight: 900; margin: 10px 0; letter-spacing: -1px; }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Container */
        .content { padding: 0 20px; margin-top: -50px; }

        .card {
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        /* List Items */
        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: white;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .icon {
            width: 45px; height: 45px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: bold;
        }

        /* MODAL DYNAMIQUE (Ilay mazava sy manjavozavo) */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px); /* Eto ilay manjavozavo be */
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 25px;
            animation: fadeIn 0.3s ease;
        }

        .modal-box {
            background: white;
            width: 100%;
            border-radius: 35px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            transform: scale(0.9);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        input {
            width: 100%; padding: 18px; margin-bottom: 15px;
            border-radius: 18px; border: 2px solid #f1f5f9;
            background: #f8fafc; font-size: 16px; box-sizing: border-box;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: white; }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn {
            padding: 18px; border: none; border-radius: 18px;
            color: white; font-weight: 800; font-size: 15px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }

        /* Nav Bar */
        .nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 85px; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid #eee; z-index: 1000;
        }

        .nav-item { text-align: center; font-size: 10px; font-weight: 800; color: #94a3b8; }
        .nav-item.active { color: var(--primary); }

        .plus-btn {
            width: 65px; height: 65px; background: var(--primary);
            border-radius: 22px; color: white; border: none;
            font-size: 30px; margin-top: -45px;
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.4);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div id="main-wrapper">
        <div class="header">
            <h1 style="margin:0; font-style: italic;">Gestion<span style="color:var(--accent)">Ko</span></h1>
            <div style="margin-top:20px; font-size:12px; opacity:0.8; text-transform:uppercase; letter-spacing:2px;">Solde Ankehitriny</div>
            <div class="balance-amount" id="totalBal">0 Ar</div>
            
            <div class="summary-grid">
                <div class="summary-card">
                    <small>MIDITRA</small>
                    <div id="totalIn" style="color:#4ade80; font-weight:900;">+ 0</div>
                </div>
                <div class="summary-card">
                    <small>MIVOAKA</small>
                    <div id="totalOut" style="color:#f87171; font-weight:900;">- 0</div>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="card" style="text-align: center;">
                <div style="position: relative; width: 170px; height: 170px; margin: 0 auto;">
                    <canvas id="cercleChart"></canvas>
                    <div id="percDisplay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 900; font-size: 22px; color: var(--primary);">0%</div>
                </div>
            </div>
            
            <h3 style="margin: 25px 0 15px 5px;">Transactions</h3>
            <div id="list"></div>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active">🏠<br>HOME</div>
        <button class="plus-btn" onclick="toggleModal()">+</button>
        <div class="nav-item">📊<br>HISTORIQUE</div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h2 style="margin-top:0; font-weight:900;">Hampiditra vola</h2>
            <input type="text" id="desc" placeholder="Antsipiriany...">
            <input type="number" id="amt" placeholder="Vola firy (Ar)...">
            <div class="btn-row">
                <button class="btn" style="background: var(--success);" onclick="add('in')">MIDITRA</button>
                <button class="btn" style="background: var(--danger);" onclick="add('out')">MIVOAKA</button>
            </div>
            <p onclick="toggleModal()" style="text-align:center; color:#94a3b8; margin-top:20px; font-weight:700; font-size:12px;">HIVERINA</p>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('gko_final')) || [];
        let chart = null;

        function toggleModal() {
            const m = document.getElementById('modal');
            const w = document.getElementById('main-wrapper');
            if (m.style.display === 'flex') {
                m.style.display = 'none';
                w.classList.remove('is-blurred');
            } else {
                m.style.display = 'flex';
                w.classList.add('is-blurred');
            }
        }

        function add(type) {
            const d = document.getElementById('desc').value;
            const a = document.getElementById('amt').value;
            if(!d || !a) return;
            data.unshift({
                id: Date.now(),
                desc: d,
                amt: parseFloat(a),
                type: type,
                label: new Date().toLocaleDateString('mg-MG', {day:'2-digit', month:'short'})
            });
            localStorage.setItem('gko_final', JSON.stringify(data));
            document.getElementById('desc').value = '';
            document.getElementById('amt').value = '';
            toggleModal();
            render();
        }

        function remove(id) {
            if(confirm('Hofafana?')) {
                data = data.filter(x => x.id !== id);
                localStorage.setItem('gko_final', JSON.stringify(data));
                render();
            }
        }

        function render() {
            const l = document.getElementById('list');
            l.innerHTML = '';
            let ti = 0, to = 0;

            data.forEach((x, i) => {
                const isIn = x.type === 'in';
                if(isIn) ti += x.amt; else to += x.amt;
                if(i < 10) {
                    l.innerHTML += `
                        <div class="transaction">
                            <div style="display:flex; align-items:center; gap:15px;">
                                <div class="icon" style="background:${isIn?'#ecfdf5':'#fef2f2'}; color:${isIn?'#10b981':'#ef4444'}">
                                    ${isIn?'↓':'↑'}
                                </div>
                                <div>
                                    <div style="font-weight:700;">${x.desc}</div>
                                    <div style="font-size:10px; color:#94a3b8;">${x.label}</div>
                                </div>
                            </div>
                            <div style="text-align:right; display:flex; gap:10px;">
                                <div style="font-weight:900; color:${isIn?'#10b981':'#ef4444'}">${x.amt.toLocaleString()}</div>
                                <div onclick="remove(${x.id})" style="color:#ddd">×</div>
                            </div>
                        </div>`;
                }
            });

            document.getElementById('totalBal').innerText = (ti - to).toLocaleString() + " Ar";
            document.getElementById('totalIn').innerText = "+ " + ti.toLocaleString();
            document.getElementById('totalOut').innerText = "- " + to.toLocaleString();
            document.getElementById('percDisplay').innerText = (ti+to)>0 ? Math.round((ti/(ti+to))*100)+"%" : "0%";
            updateChart(ti, to);
        }

        function updateChart(ti, to) {
            const ctx = document.getElementById('cercleChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [ti || 1, to || 0.001],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0,
                        borderRadius: 10
                    }]
                },
                options: { cutout: '85%', plugins: { legend: { display: false } } }
            });
        }
        window.onload = render;
    </script>
</body>
</html>
