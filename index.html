<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GestionKo Custom Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --blue: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 0;
            color: var(--primary);
            -webkit-font-smoothing: antialiased;
        }

        /* Blur Effect */
        #main-app.is-blurred {
            filter: blur(15px);
            transform: scale(0.98);
            transition: all 0.4s ease;
        }

        .header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: white;
            padding: 50px 20px 80px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .bal-value { font-size: 42px; font-weight: 800; margin: 10px 0; }

        .stat-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .content { padding: 0 18px; margin-top: -50px; }

        .chart-card {
            background: var(--card);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            display: flex; align-items: center; justify-content: space-between;
        }

        /* Tableau Styling */
        .table-card {
            background: var(--card);
            border-radius: 30px;
            margin-top: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 15px; text-align: left; font-size: 10px; color: #64748b; text-transform: uppercase; }
        td { padding: 16px 15px; border-bottom: 1px solid #f8fafc; font-size: 14px; }
        
        .cat-tag {
            font-size: 10px; font-weight: 700; background: #f1f5f9;
            padding: 4px 8px; border-radius: 6px; color: var(--blue);
            display: inline-block; margin-top: 4px;
        }

        /* Floating Button */
        .fab {
            position: fixed; bottom: 30px; right: 25px;
            width: 65px; height: 65px; background: var(--blue);
            border-radius: 22px; color: white; border: none; font-size: 32px;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4); z-index: 1000;
        }

        /* Modal Custom */
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(12px);
            z-index: 2000; align-items: center; justify-content: center; padding: 20px;
        }

        .modal {
            background: white; width: 100%; border-radius: 35px;
            padding: 35px; box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease-out;
        }

        input {
            width: 100%; padding: 18px; margin-bottom: 12px;
            border-radius: 18px; border: 1px solid #e2e8f0;
            background: #f8fafc; font-size: 16px; box-sizing: border-box; outline: none;
        }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn {
            padding: 18px; border: none; border-radius: 18px;
            font-weight: 800; color: white; font-size: 14px;
        }

        @keyframes slideIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="main-app">
        <div class="header">
            <div style="font-size: 11px; opacity: 0.6; letter-spacing: 2px;">SOLDE TOTAL</div>
            <div class="bal-value" id="totalBal">0 Ar</div>
            
            <div class="stat-grid">
                <div class="stat-card">
                    <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">MIDITRA</div>
                    <div id="totalIn" style="color:var(--success); font-weight: 800;">0</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 10px; opacity: 0.7; margin-bottom: 5px;">MIVOAKA</div>
                    <div id="totalOut" style="color:var(--danger); font-weight: 800;">0</div>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="chart-card">
                <div style="width: 100px; height: 100px;">
                    <canvas id="myChart"></canvas>
                </div>
                <div style="text-align: right;">
                    <div id="percDisplay" style="font-size: 32px; font-weight: 900; color: var(--blue);">0%</div>
                    <div style="font-size: 10px; color: #94a3b8; font-weight: 700;">GESTION PRO</div>
                </div>
            </div>

            <h4 style="margin: 30px 0 15px 5px; font-size: 18px; font-weight: 800;">Transactions</h4>
            
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Antsipiriany</th>
                            <th style="text-align: right;">Vola</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
        <div style="height: 100px;"></div>
    </div>

    <button class="fab" onclick="toggleModal(true)">+</button>

    <div class="overlay" id="modalOverlay" onclick="if(event.target==this)toggleModal(false)">
        <div class="modal">
            <h3 style="margin-top: 0; margin-bottom: 20px; font-weight: 900;">Hanampy Transaction</h3>
            
            <input type="text" id="desc" placeholder="Anarany (ohatra: Karama)">
            <input type="text" id="cat" placeholder="Sokajy (ohatra: Sakafo, Jiro...)">
            <input type="number" id="amt" placeholder="Vola (Ar)" inputmode="numeric">
            
            <div class="btn-row">
                <button class="btn" style="background: var(--success);" onclick="add('in')">MIDITRA</button>
                <button class="btn" style="background: var(--danger);" onclick="add('out')">MIVOAKA</button>
            </div>
            
            <p onclick="toggleModal(false)" style="text-align: center; color: #94a3b8; font-weight: 700; margin-top: 20px; font-size: 13px;">HIVERINA</p>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('gko_custom_v1')) || [];
        let chart = null;

        function toggleModal(s) {
            const m = document.getElementById('modalOverlay');
            const a = document.getElementById('main-app');
            m.style.display = s ? 'flex' : 'none';
            if(s) a.classList.add('is-blurred'); else a.classList.remove('is-blurred');
        }

        function add(type) {
            const d = document.getElementById('desc').value;
            const c = document.getElementById('cat').value || 'Hafa';
            const a = document.getElementById('amt').value;

            if(!d || !a) return alert('Fenoy ny anarany sy ny vola!');

            db.unshift({
                id: Date.now(),
                desc: d,
                cat: c,
                amt: parseFloat(a),
                type: type,
                date: new Date().toLocaleDateString('mg-MG', {day:'2-digit', month:'short'})
            });

            localStorage.setItem('gko_custom_v1', JSON.stringify(db));
            document.getElementById('desc').value = '';
            document.getElementById('cat').value = '';
            document.getElementById('amt').value = '';
            toggleModal(false);
            render();
        }

        function remove(id) {
            if(confirm('Hofafana ity?')) {
                db = db.filter(x => x.id !== id);
                localStorage.setItem('gko_custom_v1', JSON.stringify(db));
                render();
            }
        }

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            let ti = 0, to = 0;

            db.forEach(item => {
                const isIn = item.type === 'in';
                if(isIn) ti += item.amt; else to += item.amt;

                tbody.innerHTML += `
                    <tr onclick="remove(${item.id})">
                        <td>
                            <div style="font-weight: 700;">${item.desc}</div>
                            <div class="cat-tag">${item.cat}</div>
                            <span style="font-size: 10px; color: #94a3b8; margin-left: 5px;">${item.date}</span>
                        </td>
                        <td style="text-align: right; font-weight: 800; color: ${isIn ? 'var(--success)' : 'var(--danger)'}">
                            ${isIn ? '+' : '-'} ${item.amt.toLocaleString()}
                        </td>
                    </tr>
                `;
            });

            document.getElementById('totalBal').innerText = (ti - to).toLocaleString() + " Ar";
            document.getElementById('totalIn').innerText = ti.toLocaleString();
            document.getElementById('totalOut').innerText = to.toLocaleString();
            document.getElementById('percDisplay').innerText = (ti + to) > 0 ? Math.round((ti / (ti + to)) * 100) + "%" : "0%";
            
            updateChart(ti, to);
        }

        function updateChart(ti, to) {
            const ctx = document.getElementById('myChart').getContext('2d');
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [ti || 1, to || 0.001],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderWidth: 0,
                        borderRadius: 6
                    }]
                },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        window.onload = render;
    </script>
</body>
</html>
