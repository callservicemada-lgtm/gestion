<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GestionKo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: sans-serif; background: #f4f7fe; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        .glass-card { background: #ffffff; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; padding: 20px; transition: 0.3s; }
        .active-tab { display: block !important; animation: fadeIn 0.3s ease; }
        .tab-content { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Navigation raikitra eo ambany */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 1000; }
        .add-btn { background: #4f46e5; width: 55px; height: 55px; border-radius: 18px; color: white; display: flex; justify-content: center; align-items: center; font-size: 24px; margin-top: -30px; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3); }
    </style>
</head>
<body class="pb-24">

    <div style="background: #4f46e5; padding: 30px 20px 60px 20px; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; color: white; text-align: center;">
        <h1 style="font-style: italic; font-weight: bold; font-size: 24px;">Gestion<span style="color: #fbbf24;">Ko</span></h1>
        <p style="font-size: 10px; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; margin-top: 10px;">Solde General</p>
        <h2 id="totalBal" style="font-size: 32px; font-weight: 900; margin: 5px 0;">0 Ar</h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;">
            <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 20px;">
                <small style="font-size: 9px; opacity: 0.8;">MIDITRA</small>
                <div id="totalIn" style="color: #86efac; font-weight: bold;">+ 0 Ar</div>
            </div>
            <div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 20px;">
                <small style="font-size: 9px; opacity: 0.8;">MIVOAKA</small>
                <div id="totalOut" style="color: #fca5a5; font-weight: bold;">- 0 Ar</div>
            </div>
        </div>
    </div>

    <div style="padding: 0 20px; margin-top: -30px;">
        <div id="view-home" class="tab-content active-tab">
            <div class="glass-card" style="text-align: center;">
                <div style="position: relative; width: 160px; height: 160px; margin: 0 auto;">
                    <canvas id="cercleChart"></canvas>
                    <div id="percDisplay" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 900; font-size: 20px; color: #4f46e5;">0%</div>
                </div>
            </div>
            <h4 style="font-weight: bold; margin-bottom: 10px; color: #334155;">Transaction Vaovao</h4>
            <div id="recentList"></div>
        </div>

        <div id="view-history" class="tab-content">
            <div class="glass-card">
                <input type="date" id="searchDate" oninput="render()" style="width: 100%; border: none; outline: none; font-weight: bold; color: #4f46e5;">
            </div>
            <div id="fullHistory"></div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 20px; color: #94a3b8; font-size: 10px; font-weight: bold; letter-spacing: 2px;">
        CREATION BY MAHAITIA
    </div>

    <div class="bottom-nav">
        <div onclick="changeView('home')" style="text-align: center; color: #4f46e5;">
            <i class="fas fa-home"></i><br><span style="font-size: 9px; font-weight: bold;">HOME</span>
        </div>
        <div onclick="toggleModal()" class="add-btn">
            <i class="fas fa-plus"></i>
        </div>
        <div onclick="changeView('history')" style="text-align: center; color: #94a3b8;">
            <i class="fas fa-history"></i><br><span style="font-size: 9px; font-weight: bold;">HISTORY</span>
        </div>
    </div>

    <div id="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; width: 100%; border-radius: 30px; padding: 30px;">
            <h3 style="font-weight: bold; margin-bottom: 20px;">Transaction Vaovao</h3>
            <input type="text" id="desc" placeholder="Inona ity?" style="width: 100%; padding: 15px; background: #f8fafc; border-radius: 15px; border: none; margin-bottom: 15px; outline: none;">
            <input type="number" id="amt" placeholder="Vola (Ar)" style="width: 100%; padding: 15px; background: #f8fafc; border-radius: 15px; border: none; margin-bottom: 20px; outline: none; font-weight: bold;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="save('in')" style="background: #22c55e; color: white; padding: 15px; border-radius: 15px; border: none; font-weight: bold;">MIDITRA</button>
                <button onclick="save('out')" style="background: #ef4444; color: white; padding: 15px; border-radius: 15px; border: none; font-weight: bold;">MIVOAKA</button>
            </div>
            <button onclick="toggleModal()" style="width: 100%; margin-top: 15px; color: #94a3b8; border: none; background: none; font-size: 12px;">HIVERINA</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('maititia_db')) || [];
        let myChart = null;

        function changeView(v) {
            document.getElementById('view-home').style.display = (v === 'home') ? 'block' : 'none';
            document.getElementById('view-history').style.display = (v === 'history') ? 'block' : 'none';
            render();
        }

        function toggleModal() {
            const m = document.getElementById('modal');
            m.style.display = (m.style.display === 'none' || m.style.display === '') ? 'flex' : 'none';
        }

        function save(type) {
            const d = document.getElementById('desc').value;
            const a = document.getElementById('amt').value;
            if(!d || !a) return;
            const now = new Date();
            db.unshift({
                desc: d,
                amt: parseFloat(a),
                type: type,
                date: now.toISOString().split('T')[0],
                label: now.toLocaleDateString('mg-MG', {day:'2-digit', month:'short'})
            });
            localStorage.setItem('maititia_db', JSON.stringify(db));
            document.getElementById('desc').value = '';
            document.getElementById('amt').value = '';
            toggleModal();
            render();
        }

        function del(i) {
            if(confirm('Hofafana?')) { db.splice(i, 1); localStorage.setItem('maititia_db', JSON.stringify(db)); render(); }
        }

        function render() {
            const recent = document.getElementById('recentList');
            const history = document.getElementById('fullHistory');
            const search = document.getElementById('searchDate').value;
            
            recent.innerHTML = '';
            history.innerHTML = '';
            let ti = 0, to = 0;

            db.forEach((item, i) => {
                const isIn = item.type === 'in';
                if(isIn) ti += item.amt; else to += item.amt;

                const card = `
                    <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center; padding: 15px;">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="width: 35px; height: 35px; border-radius: 10px; background: ${isIn ? '#f0fdf4':'#fef2f2'}; color: ${isIn ? '#22c55e':'#ef4444'}; display: flex; align-items: center; justify-content: center; font-size: 12px;">
                                <i class="fas ${isIn ? 'fa-arrow-down':'fa-arrow-up'}"></i>
                            </div>
                            <div>
                                <div style="font-size: 13px; font-weight: bold;">${item.desc}</div>
                                <div style="font-size: 9px; color: #94a3b8;">${item.label}</div>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="font-weight: 900; color: ${isIn ? '#22c55e':'#ef4444'}; font-size: 14px;">${isIn?'+':'-'}${item.amt.toLocaleString()}</div>
                            <i onclick="del(${i})" class="fas fa-trash" style="color: #eee; font-size: 12px;"></i>
                        </div>
                    </div>
                `;
                if(i < 5) recent.innerHTML += card;
                if(!search || item.date === search) history.innerHTML += card;
            });

            document.getElementById('totalBal').innerText = (ti - to).toLocaleString() + " Ar";
            document.getElementById('totalIn').innerText = "+ " + ti.toLocaleString();
            document.getElementById('totalOut').innerText = "- " + to.toLocaleString();
            
            const p = (ti + to) > 0 ? Math.round((ti / (ti + to)) * 100) : 0;
            document.getElementById('percDisplay').innerText = p + "%";
            
            updateChart(ti, to);
        }

        function updateChart(ti, to) {
            const ctx = document.getElementById('cercleChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [ti || 1, to || 0.0001],
                        backgroundColor: ['#22c55e', '#ef4444'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '80%', plugins: { legend: { display: false } }, animation: { duration: 800 } }
            });
        }

        window.onload = render;
    </script>
</body>
</html>
