<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionako by Mahaitia</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #020617;
            --card: #0f172a;
            --manga: #38bdf8;
            --mavo: #fbbf24;
            --fotsy: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--fotsy);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        /* HEADER & SIGNATURE STYLER */
        .header-section {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
            animation: fadeInDown 1s ease;
        }

        .logo-main {
            font-size: 3.5rem;
            margin-bottom: -10px;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.4));
        }

        .app-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .mahaitia-signature {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--mavo);
            margin-top: 5px;
            text-transform: uppercase;
            animation: glowMahaitia 2s infinite alternate;
        }

        @keyframes glowMahaitia {
            from { text-shadow: 0 0 2px var(--mavo); opacity: 0.8; }
            to { text-shadow: 0 0 15px var(--manga), 0 0 20px var(--mavo); opacity: 1; }
        }

        /* DASHBOARD - ADAPTIVE ECRAN */
        .dashboard {
            width: 100%; max-width: 380px;
            background: linear-gradient(160deg, var(--card) 0%, #1e293b 100%);
            border-radius: 35px; padding: 25px;
            text-align: center; margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .chart-box {
            position: relative;
            width: 190px; height: 190px;
            margin: 0 auto 20px;
        }

        .chart-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .chart-center h1 { font-size: 2rem; margin: 0; color: var(--fotsy); }

        /* STATS GRID */
        .stats-container {
            display: flex; justify-content: space-around;
            padding: 15px; background: rgba(0,0,0,0.2);
            border-radius: 20px; margin-top: 15px;
        }
        .stat-label { font-size: 0.65rem; opacity: 0.6; display: block; margin-bottom: 4px; }
        .stat-val { font-weight: 800; font-size: 1rem; }

        /* FORM STYLER */
        .form-box {
            width: 100%; max-width: 380px;
            background: var(--card); padding: 20px;
            border-radius: 25px; margin-bottom: 25px;
        }

        input, select {
            width: 100%; background: #1e293b; border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: white;
            margin-bottom: 12px; outline: none; font-size: 1rem;
        }

        .btn-mahaitia {
            width: 100%; 
            background: linear-gradient(90deg, var(--manga) 0%, var(--mavo) 100%);
            color: #020617; border: none; padding: 16px;
            border-radius: 15px; font-weight: 900; font-size: 1rem;
            cursor: pointer; transition: 0.3s;
        }
        .btn-mahaitia:active { transform: scale(0.96); }

        /* HISTORY LIST */
        .history { width: 100%; max-width: 380px; }
        .item {
            background: var(--card); padding: 15px; border-radius: 18px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-right: 4px solid var(--manga);
            animation: slideUp 0.4s ease-out;
        }
        .item.out { border-right-color: var(--mavo); }

        @keyframes fadeInDown { from {opacity: 0; transform: translateY(-20px);} to {opacity: 1; transform: translateY(0);} }
        @keyframes slideUp { from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);} }

        .btn-del { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; padding: 6px 10px; border-radius: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="logo-main">💎</div>
        <div class="app-title">
            <span style="color:var(--manga)">GESTIO</span><span style="color:var(--mavo)">NAKO</span>
        </div>
        <div class="mahaitia-signature">Creation by Mahaitia</div>
    </div>

    <div class="dashboard">
        <div class="chart-box">
            <canvas id="myChart"></canvas>
            <div class="chart-center">
                <h1 id="pct">0%</h1>
                <small style="opacity:0.5; font-size: 0.6rem;">SISA</small>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <div id="balance" style="font-size: 2.2rem; font-weight: 900;">0 Ar</div>
            <small style="opacity: 0.4; letter-spacing: 1px;">TOTAL BALANCE</small>
        </div>

        <div class="stats-container">
            <div>
                <small class="stat-label">MIDITRA</small>
                <span class="stat-val" style="color:var(--manga)" id="tin">+0</span>
            </div>
            <div>
                <small class="stat-label">MIVOAKA</small>
                <span class="stat-val" style="color:var(--mavo)" id="tout">-0</span>
            </div>
        </div>
    </div>

    <div class="form-box">
        <input type="text" id="name" placeholder="Inona no natao?">
        <input type="number" id="price" placeholder="Vola (Ar)">
        <select id="type">
            <option value="in">Vola Miditra (+)</option>
            <option value="out" selected>Vola Mivoaka (-)</option>
        </select>
        <button class="btn-mahaitia" onclick="addData()">HAMPIDITRA 🚀</button>
    </div>

    <div class="history" id="history"></div>

    <script>
        // Nampiana localStorage eto mba tsy ho very ny data
        let data = JSON.parse(localStorage.getItem('mahaitia_data')) || [];
        let chart;

        function addData() {
            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const type = document.getElementById('type').value;

            if(!name || isNaN(price)) return;

            data.push({ name, price, type });
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            
            saveAndRefresh();
        }

        function deleteData(index) {
            data.splice(index, 1);
            saveAndRefresh();
        }

        // Fampidirana ny data ao amin'ny fitadidiana (Storage)
        function saveAndRefresh() {
            localStorage.setItem('mahaitia_data', JSON.stringify(data));
            update();
        }

        function update() {
            const hist = document.getElementById('history');
            hist.innerHTML = '';
            let tIn = 0, tOut = 0;

            data.forEach((item, i) => {
                if(item.type === 'in') tIn += item.price;
                else tOut += item.price;

                const div = document.createElement('div');
                div.className = `item ${item.type === 'out' ? 'out' : ''}`;
                div.innerHTML = `
                    <div>
                        <b style="color:${item.type==='in' ? 'var(--manga)' : 'var(--mavo)'}">${item.name}</b><br>
                        <small style="opacity:0.5">${item.price.toLocaleString()} Ar</small>
                    </div>
                    <button class="btn-del" onclick="deleteData(${i})">Fafana</button>
                `;
                hist.prepend(div);
            });

            const bal = tIn - tOut;
            const pct = tIn > 0 ? Math.max(0, Math.round(((tIn - tOut) / tIn) * 100)) : 0;

            document.getElementById('balance').innerText = bal.toLocaleString() + ' Ar';
            document.getElementById('tin').innerText = '+' + tIn.toLocaleString();
            document.getElementById('tout').innerText = '-' + tOut.toLocaleString();
            document.getElementById('pct').innerText = pct + '%';

            updateChart(tIn, tOut);
        }

        function updateChart(tin, tout) {
            const ctx = document.getElementById('myChart').getContext('2d');
            const sisa = Math.max(0, tin - tout);
            if(chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [sisa, tout],
                        backgroundColor: ['#38bdf8', '#fbbf24'],
                        borderWidth: 0,
                        cutout: '82%',
                        borderRadius: 15
                    }]
                },
                options: {
                    plugins: { legend: { display: false } },
                    animation: { duration: 1500, easing: 'easeOutQuart' }
                }
            });
        }

        // Alefa avy hatrany rehefa misokatra ny app
        update();
    </script>
</body>
</html>
